[package]
name = "spherekit-text"
description = "Font loading, shaping and MTSDF glyph rendering for SphereKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["text", "font", "shaping", "mtsdf", "glyph"]
categories = ["graphics", "text-processing"]

[dependencies]
spherekit-core.workspace = true
spherekit-render.workspace = true
ttf-parser.workspace = true
rustybuzz.workspace = true
fontdb.workspace = true
unicode-bidi.workspace = true
unicode-script.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytemuck.workspace = true

[dev-dependencies]
image.workspace = true

# Windows-only, for reading the shell's own interface font out of
# `NONCLIENTMETRICSW`. Hard-coding a family instead would put Latin metrics on a
# Japanese or Thai desktop; see `system_ui`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
