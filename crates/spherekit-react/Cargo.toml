[package]
name = "spherekit-react"
description = "Rust host tree for the SphereKit React reconciler frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["react", "reconciler", "ui", "jsx", "native"]
categories = ["gui", "api-bindings"]

# This directory holds two packages: this crate, and the `@spherekit/react` npm
# package that shares the name and the `src/` folder. Without this, `cargo
# package` ships the TypeScript sources, the bun test suite and two tsconfigs
# inside the Rust tarball — files no Rust consumer can use and that make the
# crate look like it contains a JavaScript project.
#
# `runtime/prelude.js` is deliberately *not* excluded: `PRELUDE` embeds it, so
# excluding it would stop the crate compiling.
exclude = [
    "src/*.ts",
    "src/*.tsx",
    "test",
    "index.tsx",
    "package.json",
    "tsconfig.json",
    "tsconfig.build.json",
    "dist",
    "node_modules",
]

[dependencies]
spherekit-core.workspace = true
spherekit-css.workspace = true
spherekit-layout.workspace = true
spherekit-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
