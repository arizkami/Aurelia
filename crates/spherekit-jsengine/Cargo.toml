[package]
name = "spherekit-jsengine"
description = "Safe Rust access to a bundled V8 runtime, for embedding JavaScript in SphereKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["v8", "javascript", "embedding", "engine", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]
build = "build.rs"

# The prebuilt is 74 MB of V8 and is fetched, not committed. Excluded so that a
# checkout which happens to have one cannot smuggle it into a published tarball.
exclude = ["v8backend", "*.lock"]

[dependencies]

[build-dependencies]
cc = "1.2"
