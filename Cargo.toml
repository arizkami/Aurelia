[workspace]
resolver = "3"
members = [
    "crates/spherekit-core",
    "crates/spherekit-render",
    "crates/spherekit-wgpu",
    "crates/spherekit-text",
    "crates/spherekit-layout",
    "crates/spherekit-svg",
    "crates/spherekit-image",
    "crates/spherekit-platform",
    "crates/spherekit-ui",
    "crates/spherekit-audio-ui",
    "crates/spherekit",
    "crates/spherekit-jsengine",
    "crates/spherekit-react",
    "crates/spherekit-css",
    "crates/spherekit-bridge",
    "crates/spherekit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-3-Clause"
repository = "https://github.com/futureboard/spherekit"
authors = ["Futureboard Digital Technologies"]

[workspace.dependencies]
# --- internal ---
spherekit-core     = { path = "crates/spherekit-core",     version = "0.1.0" }
spherekit-render   = { path = "crates/spherekit-render",   version = "0.1.0" }
spherekit-wgpu     = { path = "crates/spherekit-wgpu",     version = "0.1.0" }
spherekit-text     = { path = "crates/spherekit-text",     version = "0.1.0" }
spherekit-layout   = { path = "crates/spherekit-layout",   version = "0.1.0" }
spherekit-svg      = { path = "crates/spherekit-svg",      version = "0.1.0" }
spherekit-image    = { path = "crates/spherekit-image",    version = "0.1.0" }
spherekit-platform = { path = "crates/spherekit-platform", version = "0.1.0" }
spherekit-ui       = { path = "crates/spherekit-ui",       version = "0.1.0" }
spherekit-audio-ui = { path = "crates/spherekit-audio-ui", version = "0.1.0" }
spherekit-react    = { path = "crates/spherekit-react",    version = "0.1.0" }
spherekit-css      = { path = "crates/spherekit-css",      version = "0.1.0" }
spherekit-bridge   = { path = "crates/spherekit-bridge",   version = "0.1.0" }

# --- foundation ---
bitflags   = "2.13"
bytemuck   = { version = "1.25", features = ["derive"] }
thiserror  = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing    = "0.1"
smallvec   = "1.15"
slotmap    = "1.0"
rustc-hash = "2.1"
parking_lot = "0.12"
crossbeam-utils = "0.8"

# --- gpu / platform ---
wgpu = { version = "30.0", default-features = false, features = ["wgsl", "dx12", "vulkan", "metal", "webgpu"] }
raw-window-handle = "0.6"
winit = "0.30.13"
pollster = "1.0"

# --- geometry / text / assets ---
lyon        = "1.0"
taffy       = { version = "0.13", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size"] }
ttf-parser  = "0.25"
rustybuzz   = "0.20"
fontdb      = "0.24"
swash       = "0.2"
unicode-bidi        = "0.3"
unicode-script      = "0.5"
unicode-linebreak   = "0.1"
unicode-segmentation = "1.12"
cssparser = "0.37"
image  = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
usvg   = { version = "0.48", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
