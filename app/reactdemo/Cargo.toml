[package]
name = "reactdemo"
description = "SphereKit React demo: React 19 running in V8, styled by CSS, rendered on the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "reactdemo"
path = "src/main.rs"

[dependencies]
spherekit.workspace = true
spherekit-bridge = { workspace = true, features = ["v8"] }
spherekit-react.workspace = true
spherekit-css.workspace = true
serde_json.workspace = true
pollster.workspace = true
